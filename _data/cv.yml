    Projects:
      - name: Nexus
        url: https://github.com/rashmi-star/claude-hackathon
        start_date: 2026
        summary: Autonomous AI engineering team that turns one instruction into verified code patches. Six Claude Opus 4.6 agents (router, frontend, backend, manager, detect, plan, patch) produce unified diffs that are applied via git and verified with a real build, plus a reflector that writes learnings to persistent memory. Built with Rashmi Elavazhagan for the Claude Code hackathon.

      - name: AI Medical Analyst
        start_date: 2025-10
        summary: Weekend build at the Caltech Longevity Hackathon. Uploads medical PDFs or images, extracts text with pdf-parse and Tesseract OCR, and uses a structured LLaMA prompt to return a summary, abnormal-value flags, categories, and related PubMed titles. Next.js, Tailwind, Supabase storage, Postgres, and edge functions.

      - name: SimuChat
        url: https://github.com/gokulsrinaths/Simuchat
        start_date: 2025-05
        summary: Multi-agent group chat simulator built at the Nous RL Environments Hackathon. LLaMA-4-Maverick agents with a real-time trust network, insight detection, and a reward system. Streamlit and terminal interfaces, JSONL logging.
        highlights:
          - Written up on HackerNoon as "This Is What Happens When You Lock Three AIs in a Chat Room".

      - name: Installama
        start_date: 2025-05
        summary: Built at LlamaCon 2025, Meta's first official hackathon for the LLaMA API, run with Cerebral Valley. Triple-tapping an Instagram-style post opens a conversation that answers as the post, using the caption, tags, and Gemini Vision image analysis. Next.js, Express with SSE streaming, Supabase.

      - name: OptiShield AI
        url: https://github.com/gokulsrinaths/OTPShield
        start_date: 2025-05
        summary: AI-powered firewall for OTP scam prevention. Third place, Future of Business track, Cal Poly Pomona AI for a Better Future Hackathon 2025 (239 students, 51 teams).

      - name: Zero-to-Forecast and NL2TS-675
        url: https://github.com/gokulsrinaths/zero-to-forecast
        start_date: 2025
        summary: Cross-modal framework and six-domain benchmark for forecasting time series from natural-language descriptions, with a live interactive demo.

